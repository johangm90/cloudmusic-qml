[package]
name = "cloudmusic"
version = "1.8.0"
authors = ["Johan  Guerreros <johangm90@gmail.com>"]
edition = "2024"
build = "src/build.rs"

[dependencies]
qmetaobject = "0.2.9"
gettext-rs = "0.7"
cstr = "0.2.11"
cpp = "0.5"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"
md5 = "0.7"
base64 = "0.22"
urlencoding = "2.1"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"

[build-dependencies]
cpp_build = "0.5"
