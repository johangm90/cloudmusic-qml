name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-click:
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            image: clickable/ci-20.04-arm64
            artifact_glob: build/aarch64-linux-gnu/app/*.click

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build click package
        run: clickable build

      - name: Review click package
        run: clickable review

      - name: Upload click artifact
        uses: actions/upload-artifact@v4
        with:
          name: click-${{ matrix.arch }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7
